<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFrame</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background: khaki;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }

        .card {
            background-color: blueviolet;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 52px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        h3 {
            margin-top: 0;
            color: #1e293b;
        }

        iframe {
            width: 100%;
            border-radius: 8px;
            border: none;
        }

    </style>
</head>

<body>
    <div class="card">
        <h3>IFrame Harit ve video</h3>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/93yGqpNt39s?si=Q1Ffocya1KSuXCSO" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <br>
        <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d24780.775923401714!2d28.6425088!3d40.99604479999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1str!2str!4v1789995721575!5m2!1str!2str" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
</body>

</html>
