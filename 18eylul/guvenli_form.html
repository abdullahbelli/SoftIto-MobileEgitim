<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güvenli Form ve regex doğrulama</title>
    <style>
        body{
            font-family: sans-serif;
            padding: 20px;
            max-width: 450px;
            margin: auto;
            background: #fafafa;
        }
        .field{
            margin-bottom: 16px;

        }
        label{
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 13px;
        }
        input{
            width: 100%;
            padding: 10px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }
        input:user-invalid{
            border-color: red; background: #fefefe;

        }
        input:user-valid{
            border-color:  green; background-color: aliceblue;

        }
        .err{
            display: none;
            color: red;
            font-size: 12px;
            margin-top: 4px;
        }
        input:user-invalid+.err{
            display: block;
        }
        .hp-trap{
            display: none;
        }
        button{
            width: 100%;
            background: green;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
        }

    </style>
    <!-- T.C. Kimlik No: ^[1-9]{1}[0-9]{9}[02468]{1}$
Türkiye Cep Telefonu: ^(+90|0)?5[0-9]{2}[0-9]{3}[0-9]{2}[0-9]{2}$
Güçlü Şifre: ^(?=.[a-z])(?=.[A-Z])(?=.\d)(?=.[@$!%?&])[A-Za-z\d@$!%?&]{8,}$
CVV Kodu: ^[0-9]{3}$ -->
</head>
<body>
    <h3>Kurumsal Üye Kayıt Formu</h3>
    <form action="/kayit" method="post">
        <input type="type" name="bot_check" class="hp-trap" tabindex="-1" autocomplete="off"><!-- bot doldurmasını kabul etmemk için-->
        <div class="field">
            <label for="tc"> Tc Kimlik No(11 hane)</label>
            <input type="text" id="TC" required inputmode="numeric" maxlength="11"
            pattern="^[1-9]{1}[0-9]{9}[02468]{1}$"
            title="11 haneli olmalı, 0 ile başlayamaz ve çift rakamla bitmelidir.">
            <span class="err">Geçerli bir TC Kimlik Numarası Giriniz</span>
        </div>
        <div class="field">
            <label for="tel">Cep Telefonu</label>
            <input type="tel" id="tel" name="phone" required
            pattern="^(+90|0)?5[0-9]{2}[0-9]{3}[0-9]{2}[0-9]{2}$"
            placeholder="05370633162">
            <span class="err">Geçerli bir telefon numarası giriniz.</span>
        </div>
        <div class="field">
            <label for="password">Şifre</label>
            <input type="password" name="password" id="password" required
            minlength="8"
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%?&])[A-Za-z\d@$!%?&]{8,}"
            >
            <span class="err">Şifre en az 8 karakter büyük küçük harf rakam ve özel karakter içermelidir.</span>
        </div>
        <button type="submit">Kayıt Ol</button>
    </form>
</body>
</html>
