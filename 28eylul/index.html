        // Rest Api olarak Dışardan Veri Çekme

        const kozmetikUrunleriniGetir = async () => {
            try {
                console.log("Harici Apiye Bağlanılıyor");

                const response = await fetch(
                    "https://dummyjson.com/products/category/beauty"
                );
                if (!response.ok) {
                    throw new Error(`Http hatası: ${response.status}`);
                }

                const data = await response.json();
                console.log(`Toplam ${data.products.length} adet kozmetik ürün çekildi.`);

                const vitrin = data.products.slice(0, 3).map(p => ({
                    title: p.title,
                    fiyat: p.price,
                    stok: p.stok
                }));
                console.table(vitrin);
            } catch (err) {
                console.warn("Api Hatası", err.message);

            }
        }

        kozmetikUrunleriniGetir();


        const urunleriniGetir = async () => {
            try {
                console.log("Harici Apiye Bağlanılıyor");

                const response = await fetch(
                    "https://dummyjson.com/products/"
                );
                if (!response.ok) {
                    throw new Error(`Http hatası: ${response.status}`);
                }

                const data = await response.json();
                console.log(`Toplam ${data.products.length} adet ürün çekildi.`);

                const vitrin = data.products.slice(2, 7).map(p => ({
                    title: p.title,
                    category: p.category,
                    aciklama: p.description,
                    tag: p.tags.join(", "),
                    fiyat: p.price,
                    stok: p.stok
                }));
                console.table(vitrin);
            } catch (err) {
                console.warn("Api Hatası", err.message);

            }
        }

        urunleriniGetir();
