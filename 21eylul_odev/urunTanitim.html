<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacBook Pro M5</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: black;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        h1 {
            color: white;
            text-align: center;
        }

        h3 {
            color: #000;
            margin: 6px 6px;
        }

        .player-container {
            position: relative;
            width: 100%;
            max-width: 720px;
            border-radius: 12px;
            margin: 0 auto;
            overflow: hidden;
            background: #000;
            box-shadow: 0 10px 25 px rgba(0, 0, 0, 0.5);
        }

        video {
            width: 100%;
            display: block;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.897);
            padding: 20px;
            border-radius: 12px;
            margin: 12px 0px 52px 0px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .col {
            flex: 1;
            min-width: 0;
        }

        label {
            color: white;
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin: 6px 0px;
        }

        dialog {
            border: none;
            border-radius: 6px;
            padding: 24px;
            min-width: 400px;
        }

        meter {
            width: 100%;
            height: 24px;
            margin: 10px 0px 0px 0px;
        }

        details {
            margin-bottom: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 10px;
        }

        details[open] {
            background: #eff6ff;
        }

        details p {
            font-size: 13px;
            color: black;
            margin-top: 8px;
            margin-bottom: 0;
        }

        summary {
            font-weight: bold;
            cursor: pointer;
            color: black;
        }

        iframe {
            width: 100%;
            border-radius: 8px;
            border: none;
            margin: 6px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0px;
        }

        button:hover {
            background: rgba(47, 120, 255, 0.865);
        }

        .btn-detay {
            background: blue;
            color: white;
            margin-top: 0px;

        }
    </style>
</head>

<body>
    <h1>MacBook Pro M5</h1>

    <div class="player-container" id="videoBox">
        <video id="myVideo" playsinline controls preload="metadata">
            <source src="macbook.mp4" type="video/mp4">
            <source src="macbook.mp4" type="video/webm">
            Tarayıcınız HTML5 video etiketini desteklemiyor.

        </video>
    </div>

    <label for="m1">Ürün Stok Durumu:</label>
    <meter value="15" id="m1" min="0" max="100" low="20" high="80" optimum="90"></meter>

    <div class="btn-group">
        <button class="btn-detay" onclick="document.getElementById('dtyDialog').showModal()"> Detayları Göster</button>
    </div>

    <dialog id="dtyDialog">
        <h3 style="margin-top: 0;">Teknik Özellikler</h3>
        <details open>
            <summary>Renk Seçenekleri</summary>
            <p>Uzay Siyahı / Gümüş</p>
        </details>
        <details>
            <summary>
                Bellek
            </summary>
            <p>
                16 / 24 / 32 GB
            </p>
        </details>
        <details>
            <summary>
                Ekran
            </summary>
            <p>
                Liquid Retina XDR ekran
            </p>
        </details>
        <div style="margin-top: 16px;text-align: right;">
            <div class="btn-group">
                <button class="btn-detay" onclick="document.getElementById('dtyDialog').close()"> Kapat</button>
            </div>
        </div>
    </dialog>

    <div class="card">
        <div class="row">
            <div class="col">
                <h3>Kutu Açılışı:</h3>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/CD2sRYqVPY4?si=vYoFrmTQ7YJ-x0lk"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>

            <div class="col">
                <h3>Satın Almak İster misiniz?</h3>
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d41740.36359916053!2d29.030614642889766!3d40.97787707618548!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14cac7cb42c70659%3A0xa3f1fa45f1274b45!2sApple%20Store!5e1!3m2!1str!2str!4v1790010948997!5m2!1str!2str"
                    width="560" height="315" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </div>



    </div>
</body>

</html>
