<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Container Laboratuarı</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .chip-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .chip {
            background: white;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            color: #334115;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        h3 {
            font-size: 16px;
        }

        p {
            color: #64748b;
            font-size: 13px;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2> Mobil Filtre (flex-wrap +gap)</h2>
    <div class="chip-container">
        <div class="chip">
            Akıllı Telefon
        </div>
        <div class="chip">
            Bilgisayar
        </div>
        <div class="chip">
            Aksesuar
        </div>
        <div class="chip">
            Kulaklık
        </div>
        <div class="chip">
            Akıllı Saat
        </div>
        <div class="chip">
            Oyun Konsolu
        </div>
    </div>

    <h2>Navigasyon barı (space-between + align-items)</h2>
    <div class="card-header">
        <div>
            <h3>Kullanıcı Profili</h3>
            <p>Son Giriş: Bugün 12.44</p>
        </div>
        <button>Düzenle</button>
    </div>
</body>

</html>
